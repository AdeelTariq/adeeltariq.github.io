<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="0; url=https://adeeltariq.itch.io/" />

  <title>Redirecting to Itch.io</title>

  <style>
    html {
      background: #05030a;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
      background:
        linear-gradient(rgba(5, 3, 10, 0.45), rgba(5, 3, 10, 0.45)),
        url("https://img.itch.zone/aW1nLzE2OTY2MzcxLmdpZg==/original/lRIdwc.gif");
      background-repeat: repeat;
    }

    main {
      width: min(90vw, 420px);
      padding: 2rem;
      text-align: center;
      border: 1px solid #2ff6ff;
      border-radius: 18px;
      background: rgba(8, 6, 18, 0.88);
      box-shadow:
        0 0 24px rgba(47, 246, 255, 0.22),
        0 0 38px rgba(255, 47, 214, 0.14);
    }

    .badge {
      display: inline-block;
      margin-bottom: 0.9rem;
      padding: 0.3rem 0.65rem;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      color: #9ffcff;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(2rem, 8vw, 3rem);
      line-height: 0.95;
      letter-spacing: -0.06em;
      text-transform: uppercase;
      text-shadow:
        2px 2px 0 #ff2bd6,
        -2px -2px 0 #00f6ff;
    }

    p {
      margin: 0;
      color: #d8d4ff;
      line-height: 1.5;
    }

    a {
      display: inline-block;
      margin-top: 1.25rem;
      padding: 0.8rem 1rem;
      color: #070313;
      text-decoration: none;
      border-radius: 999px;
      background: #ff2bd6;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    a:focus,
    a:hover {
      background: #fff06a;
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">Now loading</span>
    <h1>Redirecting</h1>
    <p>You are being sent to my Itch.io page.</p>
    <a href="https://adeeltariq.itch.io/">Continue manually</a>
  </main>
</body>
</html>
